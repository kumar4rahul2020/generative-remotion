<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDE Vox Cut — prototype</title>
<style>
  :root {
    --bg: #000000;
    --ink: #ffffff;
    --dim: #5a5a5a;
    --teal: #4fd1c5;
    --mark: #ff6b4a;
    --line: rgba(255,255,255,0.1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: var(--bg);
  }

  /* Technical spec ruler - grounds the engineering-interview subject */
  .ruler {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 32px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--dim);
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }
  .ruler .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--mark);
    display: inline-block;
    margin-right: 8px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .scene {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.25s linear;
    pointer-events: none;
  }
  .scene.active { opacity: 1; }

  .kinetic {
    font-family: 'Archivo Black', Helvetica, Arial, sans-serif;
    font-weight: 400;
    text-align: center;
    text-wrap: balance;
    line-height: 0.98;
    letter-spacing: -0.01em;
  }
  .kinetic.huge { font-size: clamp(48px, 9vw, 140px); }
  .kinetic.big { font-size: clamp(36px, 6vw, 88px); }

  .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 18px;
  }

  .subtitle {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: clamp(16px, 2vw, 24px);
    color: var(--dim);
    margin-top: 16px;
  }

  /* Annotation: hand-drawn-feel underline sweep, a la Vox's live-markup style */
  .mark-wrap { position: relative; display: inline-block; }
  .mark-wrap svg {
    position: absolute;
    left: -2%; right: -2%; bottom: -0.12em;
    width: 104%; height: 0.22em;
    overflow: visible;
  }
  .mark-wrap path {
    fill: none;
    stroke: var(--mark);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
  }
  .mark-wrap.drawn path {
    animation: draw 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  .phase-row {
    display: flex;
    gap: 28px;
    margin-top: 8px;
  }
  .phase-block {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 22px;
    padding: 18px 26px;
    border: 2px solid var(--dim);
    border-radius: 4px;
    color: var(--ink);
    background: var(--bg);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }
  .phase-block.in { opacity: 1; transform: translateY(0); }
  .phase-block.focus { border-color: var(--teal); color: var(--teal); }

  .icon-mark {
    width: 64px; height: 64px;
    margin-bottom: 22px;
    opacity: 0.9;
  }

  /* Player controls - not part of the video design, just for previewing */
  .player {
    position: absolute;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--dim);
    z-index: 20;
  }
  .player button {
    background: var(--teal);
    color: #000;
    border: none;
    border-radius: 999px;
    width: 34px; height: 34px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .player button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .scrub {
    width: 320px; height: 4px;
    background: var(--line);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }
  .scrub-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--teal);
    border-radius: 2px;
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>

<!--
  HOW TO EDIT THIS FILE
  ======================
  This is plain HTML/CSS/JS - open it in any text editor, change things,
  save, and refresh this page in your browser (no build step, no server).

  - Text content: edit the words inside the <div class="scene" ...> blocks
    below (e.g. "INTERVIEW EXPERIENCE", the phase names in .phase-block).
  - Colors: edit the --teal / --mark / --ink hex values at the top of
    <style>.
  - Timing: edit the numbers (9.22, 13.2, 16.5, etc.) inside the render()
    function in <script> at the bottom - those are seconds, matched to
    real moments in the narration audio (clip.mp3, same folder).
  - Audio: clip.mp3 is the first 20s of the real narration, referenced
    below via a normal relative path - swap the file to preview against
    different audio.

  Once a design is settled, tell Claude Code to port it into the real
  Remotion pipeline (remotion/src/projects/fde-part1/) - this prototype
  itself is never rendered into the final video.
-->

<div class="stage">
  <div class="ruler">
    <span><span class="dot"></span>FDE INTERVIEW SERIES — PART 01</span>
    <span id="timecode">T+00:00.0</span>
  </div>

  <!-- Scene 1: Title -->
  <div class="scene" id="scene-title">
    <svg class="icon-mark" viewBox="0 0 64 64" fill="none">
      <rect x="4" y="4" width="56" height="56" rx="4" stroke="#4fd1c5" stroke-width="3"/>
      <path d="M18 32h28M32 18v28" stroke="#4fd1c5" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="label">Google Forward Deployed Engineer</div>
    <div class="kinetic huge">INTERVIEW<br/>EXPERIENCE</div>
    <div class="subtitle">A four-part breakdown</div>
  </div>

  <!-- Scene 2: hindsight / mental model -->
  <div class="scene" id="scene-hindsight">
    <div class="label">In Hindsight</div>
    <div class="kinetic big">
      <span class="mark-wrap" id="mark-easy">AN EASY-TO-REMEMBER<br/>MENTAL MODEL
        <svg viewBox="0 0 400 20" preserveAspectRatio="none"><path d="M5 12 Q 200 2 395 12" /></svg>
      </span>
    </div>
  </div>

  <!-- Scene 3: four phases -->
  <div class="scene" id="scene-phases">
    <div class="label">The End-to-End Cycle</div>
    <div class="kinetic big">FOUR PHASES</div>
    <div class="phase-row" id="phase-row">
      <div class="phase-block" data-phase="0">DISCOVERY</div>
      <div class="phase-block" data-phase="1">CAPABILITY &amp;<br/>RELIABILITY</div>
      <div class="phase-block" data-phase="2">SECURITY</div>
      <div class="phase-block" data-phase="3">PRODUCTION</div>
    </div>
  </div>

  <div class="player">
    <button id="playBtn" aria-label="Play">▶</button>
    <span id="curTime">0:00</span>
    <div class="scrub" id="scrub"><div class="scrub-fill" id="scrubFill"></div></div>
    <span id="durTime">0:20</span>
  </div>

  <audio id="audio" preload="auto">
    <source src="clip.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const scrub = document.getElementById('scrub');
  const scrubFill = document.getElementById('scrubFill');
  const curTime = document.getElementById('curTime');
  const timecode = document.getElementById('timecode');

  const scenes = {
    title: document.getElementById('scene-title'),
    hindsight: document.getElementById('scene-hindsight'),
    phases: document.getElementById('scene-phases'),
  };
  const markEasy = document.getElementById('mark-easy');
  const phaseBlocks = document.querySelectorAll('.phase-block');

  function fmt(t) {
    const m = Math.floor(t / 60);
    const s = (t % 60).toFixed(1).padStart(4, '0');
    return `${m}:${s}`;
  }

  // Pure function of time -> visual state, same principle Remotion uses
  // (state = f(t)), so porting this logic later is mechanical translation,
  // not a redesign.
  function render(t) {
    timecode.textContent = `T+${t.toFixed(1)}s`;
    curTime.textContent = fmt(t);
    scrubFill.style.width = `${Math.min(100, (t / 20) * 100)}%`;

    Object.values(scenes).forEach(s => s.classList.remove('active'));
    markEasy.classList.remove('drawn');
    phaseBlocks.forEach(b => b.classList.remove('in', 'focus'));

    if (t < 9.22) {
      scenes.title.classList.add('active');
    } else if (t < 13.2) {
      scenes.hindsight.classList.add('active');
      if (t > 9.9) markEasy.classList.add('drawn');
    } else {
      scenes.phases.classList.add('active');
      phaseBlocks.forEach((b, i) => {
        const delay = 13.2 + i * 0.35;
        if (t > delay) b.classList.add('in');
        if (i === 0 && t > 16.5) b.classList.add('focus');
      });
    }
  }

  let raf;
  function loop() {
    render(audio.currentTime);
    raf = requestAnimationFrame(loop);
  }

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      playBtn.textContent = '❚❚';
      raf = requestAnimationFrame(loop);
    } else {
      audio.pause();
      playBtn.textContent = '▶';
      cancelAnimationFrame(raf);
    }
  });

  audio.addEventListener('ended', () => {
    playBtn.textContent = '▶';
    cancelAnimationFrame(raf);
  });

  scrub.addEventListener('click', (e) => {
    const rect = scrub.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = Math.max(0, Math.min(20, pct * 20));
    render(audio.currentTime);
  });

  render(0);
</script>
</body>
</html>
